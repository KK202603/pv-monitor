services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - db-data:/app/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "8090:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - backend

networks:
  internal:

volumes:
  db-data:
  caddy-data:
  caddy-config:
